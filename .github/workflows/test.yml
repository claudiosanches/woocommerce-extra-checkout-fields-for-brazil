name: Tests

on:
  push:
    branches:
      - trunk
  pull_request:

permissions:
  contents: read

# A new push makes the run in progress pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - uses: ramsey/composer-install@v4
        with:
          composer-options: ${{ matrix.php != '7.4' && '--ignore-platform-reqs' || '' }}

      - run: composer run-script test:unit

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run test:unit

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # Real Google Chrome rather than bundled Chromium, so the specs run the
      # browser the storefront is used in. Independent of the environment, so
      # the two slowest setup steps overlap instead of queueing.
      - name: Install Chrome and start WordPress
        run: |
          npx playwright install --with-deps chrome &
          chrome=$!
          npx wp-env start &
          env=$!
          wait $chrome
          wait $env

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-artifacts
          path: artifacts/
          retention-days: 7

  integration:
    name: WordPress integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer

      - uses: ramsey/composer-install@v4

      - run: npm ci

      - run: npm run build

      # Its own config, so only the environment this job uses is started.
      - run: npx wp-env start --config .wp-env.tests.json

      - run: npm run test:php-integration
